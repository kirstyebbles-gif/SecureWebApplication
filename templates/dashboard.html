
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SecurePortal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">SecurePortal</div>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <form method="POST" action="{{ url_for('logout') }}" class="logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Log Out</button>
            </form>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Welcome, {{ current_user.username }}!</h1>

        <p>You have successfully logged into SecurePortal.</p>

        <a href="{{ url_for('records') }}" class="primary-button">
    Manage Records
</a>
<a href="{{ url_for('submit_request') }}">Submit a Support Request</a>

<a href="{{ url_for('my_requests') }}">View My Requests</a>

        <div class="dashboard-card">
            <h2>Your Account</h2>
            <p><strong>Username:</strong> {{ current_user.username }}</p>
            <p><strong>Email:</strong> {{ current_user.email }}</p>
            <p><strong>Account type:</strong> {{ current_user.role }}</p>
        </div>
    </main>

</body>
</html>

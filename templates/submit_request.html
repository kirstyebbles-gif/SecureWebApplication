
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request - SecurePortal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="records-container">

        <h1>Submit a Support Request</h1>

        <p>Select the category that best describes the support you need.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="category">Request category</label>

            <select id="category" name="category" required>
                <option value="">Choose a category</option>
                {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>

            <label for="title">Request title</label>

            <input
                type="text"
                id="title"
                name="title"
                maxlength="120"
                required
                placeholder="Briefly describe what you need"
            >

            <label for="description">Request description</label>

            <textarea
                id="description"
                name="description"
                rows="7"
                required
                placeholder="Explain the support you need."
            ></textarea>

            <button type="submit">Submit Request</button>

        </form>

        <p>
            <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </p>

        <p>
            <a href="{{ url_for('my_requests') }}">View My Requests</a>
        </p>

    </main>

</body>
</html>

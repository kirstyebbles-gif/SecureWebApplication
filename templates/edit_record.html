
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Record | SecurePortal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="auth-container">

        <h1>Edit Record</h1>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Record Title</label>

            <input
                type="text"
                name="title"
                value="{{ record.title }}"
                maxlength="120"
                required
            >

            <label>Record Description</label>

            <textarea name="description" rows="6" required>{{ record.description }}</textarea>

            <button type="submit">Save Changes</button>

        </form>

        <p>
            <a href="{{ url_for('records') }}">Cancel</a>
        </p>

    </div>

</body>
</html>

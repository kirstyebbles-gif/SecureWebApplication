
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - SecurePortal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="records-container">
        <h1>My Support Requests</h1>

        {% for item in requests %}
            <div class="record-card">
                <h2>{{ item.title }}</h2>

                <p><strong>Category:</strong> {{ item.category }}</p>
                <p><strong>Status:</strong> {{ item.status }}</p>
                <p><strong>Submitted:</strong> {{ item.created_at }}</p>

                <a href="{{ url_for('view_request', request_id=item.id) }}">
                    View Request
                </a>
            </div>
        {% else %}
            <p>You have not submitted any requests yet.</p>
        {% endfor %}

        <a href="{{ url_for('submit_request') }}">Submit Another Request</a>
        <br>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </main>

</body>
</html>
